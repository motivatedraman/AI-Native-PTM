services:
  - type: web
    name: nexus-task-manager
    env: python
    buildCommand: "./build.sh"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: AUTH_USERNAME
        value: raman
      - key: AUTH_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
